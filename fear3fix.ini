; EN fear3fix — configuration. Put this file next to dinput8.dll, in the game folder (next to "F.E.A.R. 3.exe").
; 
; FR fear3fix — configuration. À placer à côté de dinput8.dll, dans le dossier du jeu (à côté de « F.E.A.R. 3.exe »).
;
;
; enabled : 1 = fix active ; 0 = disabled, plain dinput8 proxy
; reasons : GSClientDeny_t reasons rewritten to 14 (k_EDenySteamValidationStalled)
;           12 = k_EDenySteamConnectionError (the one observed)
;           11 = k_EDenySteamConnectionLost, 13 = k_EDenySteamResponseTimedOut (not observed: only add them if
;           fear3fix.log shows disconnects with these reasons
; log     : 1 = write fear3fix.log next to the DLL ; 0 = no log
;
; [fov] enabled : EN 
;                 1 = re-apply the -fov:N launch option to cameras created during the game (Paxton's sprint,
;                 possession...) ; 0 = original behaviour. Does nothing without -fov:N.
; 
; 
;                 FR 
;                 1 = réapplique l'option de lancement -fov:N aux caméras créées en cours de partie (sprint,
;                 possession de Paxton...) ; 0 = comportement d'origine. Sans -fov:N, ne fait rien.
;
; [voice] EN
;         mode  : toggle = press the key once to turn the mic on, again to turn it off (off when the game starts)
;                 hold   = push-to-talk: the mic is on only while the key is held
;                 open   = mic always on (original behaviour)
;         key   : V by default. A letter or digit, F1..F24, NUMPAD0..9, MOUSE3, MOUSE4, MOUSE5, SPACE, TAB, CAPSLOCK,
;                 LSHIFT, RSHIFT, LCTRL, RCTRL, LALT, RALT, INSERT, HOME, PAGEUP..., or a Windows virtual-key code
;                 in hex (e.g. 0x56). Avoid keys the game already uses.
;         sound : 1 = short beep on each switch (high = mic on, low = mic off) ; 0 = no sound
;
;         FR
;         mode  : toggle = une pression active le micro, une autre le coupe (coupé au lancement du jeu)
;                 hold   = push-to-talk : le micro n'est actif que tant que la touche est enfoncée
;                 open   = micro toujours ouvert (comportement d'origine)
;         key   : V par défaut. Une lettre ou un chiffre, F1..F24, NUMPAD0..9, MOUSE3, MOUSE4, MOUSE5, SPACE, TAB,
;                 CAPSLOCK, LSHIFT, RSHIFT, LCTRL, RCTRL, LALT, RALT, INSERT, HOME, PAGEUP..., ou un code de touche
;                 virtuelle Windows en hexadécimal (ex. 0x56). Évitez les touches déjà utilisées par le jeu.
;         sound : 1 = petit bip à chaque bascule (aigu = micro actif, grave = micro coupé) ; 0 = aucun son
;
; EN To remove the fix: delete dinput8.dll, fear3fix.ini and fear3fix.log from the game folder.
;
; FR Pour retirer le correctif : supprimer dinput8.dll, fear3fix.ini et fear3fix.log du dossier du jeu.

[fix]
enabled=1
reasons=12
log=1

[fov]
enabled=1

[voice]
mode=toggle
key=V
sound=1
