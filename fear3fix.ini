; EN fear3fix — configuration. Put this file next to dinput8.dll, in the game folder (next to "F.E.A.R. 3.exe").
; 
; FR fear3fix — configuration. À placer à côté de dinput8.dll, dans le dossier du jeu (à côté de « F.E.A.R. 3.exe »).
;
;
; enabled : 1 = fix active ; 0 = disabled, plain dinput8 proxy
; reasons : GSClientDeny_t reasons rewritten to 14 (k_EDenySteamValidationStalled)
;           12 = k_EDenySteamConnectionError (the one observed)
;           11 = k_EDenySteamConnectionLost, 13 = k_EDenySteamResponseTimedOut (not observed: only add them if
;           fear3fix.log shows disconnects with these reasons
; log     : 1 = write fear3fix.log next to the DLL ; 0 = no log
;
; [fov] enabled : EN 
;                 1 = re-apply the -fov:N launch option to cameras created during the game (Paxton's sprint,
;                 possession...) ; 0 = original behaviour. Does nothing without -fov:N.
; 
; 
;                 FR 
;                 1 = réapplique l'option de lancement -fov:N aux caméras créées en cours de partie (sprint,
;                 possession de Paxton...) ; 0 = comportement d'origine. Sans -fov:N, ne fait rien.
;
; EN To remove the fix: delete dinput8.dll, fear3fix.ini and fear3fix.log from the game folder.
;
; FR Pour retirer le correctif : supprimer dinput8.dll, fear3fix.ini et fear3fix.log du dossier du jeu.

[fix]
enabled=1
reasons=12
log=1

[fov]
enabled=1
